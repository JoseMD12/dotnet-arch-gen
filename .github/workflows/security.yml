name: Security Audit

on:
  push:
    branches: ["main", "dev"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  pip-audit:
    name: Auditoria de Dependências (pip-audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Auditar dependências
        run: pip-audit