name: Security Audit

on:
  push:
    branches: ["**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
        
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pip-audit:
    name: Auditoria de Dependências (pip-audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Instalar pip-audit
        run: pip install pip-audit

      - name: Auditar dependências
        run: pip-audit --requirement <(pip install -e ".[dev]" --dry-run 2>/dev/null | grep "Requirement already satisfied\|Collecting" | awk '{print $NF}' || true)

      - name: Auditar dependências do projeto
        run: |
          pip install -e ".[dev]"
          pip-audit