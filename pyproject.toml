[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dotnet-arch-gen"
dynamic = ["version"]
description = "Gerador de arquitetura .NET via linha de comando"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "José Dotta", email = "josehmd.dev@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = ["pydantic>=2.0"]

[project.scripts]
dotnet-arch-gen = "dotnet_arch_gen:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "bandit", "pip-audit", "mypy"]

[tool.setuptools]
packages = ["arch_gen"]
py-modules = ["dotnet_arch_gen"]

[tool.setuptools.dynamic]
version = { attr = "arch_gen.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--cov=arch_gen --cov-report=term-missing"

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B404", "B603"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "arch_gen.*"
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
